# goal: To run the end-to-end DevSecOps pipeline 
name: devsecops



on:
  push:
    branches: [master]

permissions:
  actions: read
  checks: write
  contents: write
  security-events: write

jobs:
  code-quality:
    uses: ./.github/workflows/code-quality.yml

  secret-scanning:
    uses: ./.github/workflows/secrets-scanning.yml

  dependency-check:
    uses: ./.github/workflows/dependency-scan.yml
