#goal: My goal is to Install multiple versions of Node.js and Create lint for their multiple versions .
name: nodejs linter

on:
  workflow_call:
  workflow_dispatch:

permissions:
  checks: write
  contents: write

jobs:
  run-linters:
    name: Run linters (Node ${{ matrix.nodeV }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nodeV: ['27.0.0-alpha.0.1.0', '26', '24']
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.nodeV }}

      - name: Install Node.js dependencies
        run: npm install

      - name: Run linters
        uses: wearerequired/lint-action@v3
        with:
          eslint: true
          prettier: false

