# goall: to scan whether any secrets is leaked or not
name: secret scanning

on: 
  workflow_call:

jobs:
  scan-secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: code checkout 
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
         
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }
