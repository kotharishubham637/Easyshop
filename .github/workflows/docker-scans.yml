# goal: To ensure that the Docker file and Docker Compose file are securely tested
name: docker-scans

on:
  workflow_call:

jobs:
  docker-file-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        side: ['frontend', 'backend']
    steps:
      - name: checkout-code
        uses: actions/checkout@v7

      - name: ${{ matrix.side }}-dockerfile-lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.side }}/Dockerfile

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: docker-Build-${{ matrix.side }}
        run: docker build -t ${{ matrix.side }}/easyshop-${{ matrix.side }}:latest .
        working-directory: ${{ matrix.side }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.side }}/easyshop-${{ matrix.side }}:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

