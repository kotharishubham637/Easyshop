# goal: To lint, build, and test the frontend and backend program in Node.js .
# And then push the image to Docker Hub
name: CI

on:
  push:
    branches: [main, master]
    paths:
      - '**'
      - '!.github/workflows/**'
  workflow_dispatch:

jobs:

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: checkout the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
            
      - name: Install Node.js dependencies
        run: npm ci

      - name: Run linters
        run: npm run lint
        
      - name: test the code
        run: echo "the code is tested" 

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: ./frontend
          tags: ${{ vars.DOCKERHUB_USERNAME }}/easyshop-frontend:latest



  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: checkout the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache-dependency-path: backend/package-lock.json
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run linters
        run: npm run lint

      - name: test the code
        run: echo "the code is tested"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: ./backend
          tags: ${{ vars.DOCKERHUB_USERNAME }}/easyshop-backend:latest       

  deploy:
    needs: [frontend, backend]
    uses: ./.github/workflows/cd.yml
    secrets: inherit
