# goal: i have to do SAST for my code
name : code quality

on:
  workflow_call:

jobs:
    sast:
        runs-on: ubuntu-latest
        strategy:
          fail-fast: false
          matrix:
            node: ['frontend','backend']
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7

            - name: Setup NodeJs
              uses: actions/setup-node@v6
              with:
                node-version: '20'
                cache: npm
                cache-dependency-path: ${{matrix.node}}/package-lock.json

            - name: Install npm Packages
              run: npm install --legacy-peer-deps
              working-directory: ${{matrix.node}}

            - name: Run Linter
              run: npm run lint
              working-directory: ${{matrix.node}}
